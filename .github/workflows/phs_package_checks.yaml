on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: phs_package_checks.yaml

permissions: 
  contents: read
  pull-requests: read
  statuses: read
  packages: read

jobs:
  PHS-checks:
    uses: Public-Health-Scotland/actions/.github/workflows/phs_package_checks.yaml@add_lint_action
    with:
      lint: true
      lint_changed_files_only: false
    permissions: 
      contents: write
      pull-requests: write
      statuses: write
      packages: read
    secrets: inherit

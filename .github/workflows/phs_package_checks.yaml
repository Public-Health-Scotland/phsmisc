    branches: [main]
  pull_request:
  workflow_dispatch:

name: phs_package_checks.yaml

permissions: 
  contents: read
  pull-requests: read
  statuses: read
  
jobs:
  PHS-checks:
    uses: Public-Health-Scotland/actions/.github/workflows/phs_package_checks.yaml@split-document-and-style
